name: CI

# Manual-only: run from the Actions tab when wanted. Automatic push/PR
# triggers removed at the owner's request — local gates (build, tsc, lint,
# jest, loop tests) run before every commit anyway.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can evaluate config/module scope without
      # touching real services. No route does build-time data fetching.
      POSTGRES_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Consumer-loop integration tests (PGlite)
        run: npm run test:loops

      - name: Build
        run: npm run build
